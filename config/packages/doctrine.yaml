doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '15'

    orm:
        default_entity_manager: default
        auto_generate_proxy_classes: true

        entity_managers:
            default:
                connection: default
                mappings:
                    App:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'