services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: portail_v2
    volumes:
      - ./docker/php/php-override.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - .:/var/www
    working_dir: /var/www
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: symfony_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: postgres:15
    container_name: symfony_db
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-symfony}
      POSTGRES_USER:     ${POSTGRES_USER:-symfony}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-symfony}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d

  scrapper:
    build:
      context: ./scrapper
      dockerfile: Dockerfile
    container_name: vie_scolaire_scrapper
    ports:
      - "3000:3000"
    volumes:
      - ./scrapper:/app
      - /app/node_modules
      - ./scrapper/logs:/app/logs
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://symfony:symfony@db:5432/symfony}
      API_PORT: 3000
    depends_on:
      - db
    restart: unless-stopped


volumes:
  dbdata: